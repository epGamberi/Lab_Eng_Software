<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FoodLink – Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background:#f0f7f0; }
    .logo { font-size:1.6rem; font-weight:700; color:#2d6a4f; }
    .logo span { color:#52b788; }
    .btn-success { background:#2d6a4f; border:none; }
    .btn-success:hover { background:#1b4332; }
    .card { border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.1); }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card p-4">
        <div class="text-center mb-3">
          <div class="logo">Food<span>Link</span></div>
          <p class="text-muted small">Criar Nova Conta</p>
        </div>

        <div id="alerta" class="alert d-none" role="alert"></div>

        <!-- Perfil -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Tipo de perfil</label>
          <div class="d-flex gap-4">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="perfil" id="pDoador" value="DOADOR" checked/>
              <label class="form-check-label" for="pDoador">Sou Doador</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="perfil" id="pInst" value="INSTITUICAO"/>
              <label class="form-check-label" for="pInst">Sou Instituição</label>
            </div>
          </div>
        </div>

        <!-- Dados pessoais -->
        <div class="mb-3">
          <label for="nome" class="form-label">Nome / Razão Social</label>
          <input type="text" class="form-control" id="nome" placeholder="Ex: Padaria Bom Pão"/>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-8">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" placeholder="seu@email.com"/>
          </div>
          <div class="col-4">
            <label for="cpfcnpj" class="form-label">CPF / CNPJ</label>
            <input type="text" class="form-control" id="cpfcnpj" placeholder="000.000.000-00"/>
          </div>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" placeholder="Mínimo 6 caracteres"/>
        </div>

        <hr class="my-3"/>
        <p class="fw-semibold small text-muted mb-2">Endereço (necessário para logística de retirada)</p>

        <div class="row g-2 mb-2">
          <div class="col-4">
            <label for="cep" class="form-label">CEP</label>
            <input type="text" class="form-control" id="cep" placeholder="00000-000" oninput="buscarCep(this.value)"/>
          </div>
          <div class="col-8">
            <label for="logradouro" class="form-label">Logradouro</label>
            <input type="text" class="form-control" id="logradouro" placeholder="Rua / Av."/>
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-3">
            <label for="numero" class="form-label">Número</label>
            <input type="text" class="form-control" id="numero" placeholder="123"/>
          </div>
          <div class="col-5">
            <label for="bairro" class="form-label">Bairro</label>
            <input type="text" class="form-control" id="bairro"/>
          </div>
          <div class="col-4">
            <label for="cidade" class="form-label">Cidade</label>
            <input type="text" class="form-control" id="cidade"/>
          </div>
        </div>
        <div class="mb-3 col-3 ps-0">
          <label for="uf" class="form-label">UF</label>
          <input type="text" class="form-control" id="uf" maxlength="2" placeholder="SP"/>
        </div>

        <button class="btn btn-success w-100 mb-2" onclick="cadastrar()">Cadastrar</button>
        <a href="index.html" class="btn btn-link w-100 text-muted text-decoration-none">← Já tenho conta</a>
      </div>
    </div>
  </div>
</div>

<script>
  const API = "http://localhost:8000";

  async function buscarCep(cep) {
    cep = cep.replace(/\D/g, "");
    if (cep.length !== 8) return;
    try {
      const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      const data = await res.json();
      if (!data.erro) {
        document.getElementById("logradouro").value = data.logradouro || "";
        document.getElementById("bairro").value = data.bairro || "";
        document.getElementById("cidade").value = data.localidade || "";
        document.getElementById("uf").value = data.uf || "";
      }
    } catch (e) {}
  }

  async function cadastrar() {
    const campos = ["nome","email","senha","cep","logradouro","numero","bairro","cidade","uf"];
    for (const c of campos) {
      if (!document.getElementById(c).value.trim()) {
        mostrarAlerta("Preencha todos os campos obrigatórios.", "danger"); return;
      }
    }

    const payload = {
      nome: document.getElementById("nome").value.trim(),
      email: document.getElementById("email").value.trim(),
      senha: document.getElementById("senha").value,
      tipo_perfil: document.querySelector('input[name="perfil"]:checked').value,
      cep: document.getElementById("cep").value.trim(),
      logradouro: document.getElementById("logradouro").value.trim(),
      numero: document.getElementById("numero").value.trim(),
      bairro: document.getElementById("bairro").value.trim(),
      cidade: document.getElementById("cidade").value.trim(),
      uf: document.getElementById("uf").value.trim(),
    };

    try {
      const res = await fetch(`${API}/cadastro`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) { mostrarAlerta(data.detail || "Erro ao cadastrar.", "danger"); return; }

      sessionStorage.setItem("usuario_id", data.usuario_id);
      sessionStorage.setItem("nome", data.nome);
      sessionStorage.setItem("tipo_perfil", data.tipo_perfil);
      sessionStorage.setItem("token", data.access_token);

      mostrarAlerta("Conta criada com sucesso! Redirecionando...", "success");
      setTimeout(() => {
        if (data.tipo_perfil === "DOADOR") window.location.href = "doador.html";
        else window.location.href = "instituicao.html";
      }, 1200);
    } catch (e) {
      mostrarAlerta("Não foi possível conectar à API.", "danger");
    }
  }

  function mostrarAlerta(msg, tipo) {
    const el = document.getElementById("alerta");
    el.className = `alert alert-${tipo}`;
    el.textContent = msg;
  }
</script>
</body>
</html>
