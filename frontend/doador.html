<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FoodLink – Painel do Doador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background:#f0f7f0; }
    .navbar { background:#2d6a4f !important; }
    .navbar-brand { font-weight:700; font-size:1.4rem; color:#fff !important; }
    .navbar-brand span { color:#95d5b2; }
    .card { border-radius:12px; }
    .badge-DISPONIVEL { background:#52b788; }
    .badge-RESERVADO  { background:#f4a261; }
    .badge-ENTREGUE   { background:#6c757d; }
    .badge-CANCELADO  { background:#e63946; }
    .btn-foodlink { background:#2d6a4f; color:#fff; border:none; }
    .btn-foodlink:hover { background:#1b4332; color:#fff; }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Food<span>Link</span></span>
    <div class="d-flex align-items-center gap-3">
      <span class="text-white small" id="nomeNav"></span>
      <a href="index.html" class="btn btn-sm btn-outline-light" onclick="logout()">Sair</a>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="row g-4">
    <!-- Formulário nova doação -->
    <div class="col-md-5">
      <div class="card shadow-sm p-4">
        <h5 class="fw-bold mb-3">📦 Nova Doação</h5>
        <div id="alertaForm" class="alert d-none" role="alert"></div>

        <div class="mb-2">
          <label class="form-label">Nome do alimento</label>
          <input type="text" class="form-control" id="titulo" placeholder="Ex: Pão Francês"/>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label">Quantidade</label>
            <input type="number" class="form-control" id="quantidade" placeholder="20" min="0.1" step="0.1"/>
          </div>
          <div class="col-6">
            <label class="form-label">Unidade</label>
            <select class="form-select" id="unidade">
              <option>unid</option>
              <option>kg</option>
              <option>g</option>
              <option>litros</option>
              <option>caixas</option>
              <option>pacotes</option>
            </select>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label">Validade</label>
          <input type="date" class="form-control" id="validade"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Categoria</label>
          <select class="form-select" id="categoria"></select>
        </div>
        <button class="btn btn-foodlink w-100" onclick="publicarDoacao()">Publicar Doação</button>
      </div>
    </div>

    <!-- Histórico de doações -->
    <div class="col-md-7">
      <div class="card shadow-sm p-4">
        <h5 class="fw-bold mb-3">📋 Minhas Doações</h5>
        <div id="listaDoacoes">
          <p class="text-muted text-center">Carregando...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const API = "https://foodlink-backend-m6n0.onrender.com"
  const usuarioId = sessionStorage.getItem("usuario_id");
  const nome = sessionStorage.getItem("nome");

  if (!usuarioId || sessionStorage.getItem("tipo_perfil") !== "DOADOR") {
    window.location.href = "index.html";
  }

  document.getElementById("nomeNav").textContent = nome;

  // Define data mínima como hoje
  document.getElementById("validade").min = new Date().toISOString().split("T")[0];

  async function carregarCategorias() {
    const res = await fetch(`${API}/categorias`);
    const cats = await res.json();
    const sel = document.getElementById("categoria");
    cats.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.id_categoria;
      opt.textContent = c.nome;
      sel.appendChild(opt);
    });
  }

  async function carregarDoacoes() {
    const res = await fetch(`${API}/doacoes/usuario/${usuarioId}`);
    const doacoes = await res.json();
    const el = document.getElementById("listaDoacoes");

    if (doacoes.length === 0) {
      el.innerHTML = '<p class="text-muted text-center">Nenhuma doação cadastrada ainda.</p>';
      return;
    }

    el.innerHTML = doacoes.map(d => `
      <div class="card mb-2 border-0 bg-light">
        <div class="card-body py-2 px-3">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <strong>${d.titulo}</strong>
              <span class="badge badge-${d.status} text-white ms-2">${d.status}</span><br/>
              <small class="text-muted">${d.quantidade} ${d.unidade_medida} · Validade: ${formatarData(d.data_vencimento)}</small><br/>
              ${d.status === 'RESERVADO' ? `<small class="text-success">✅ Reservado por uma instituição. Aguardando retirada.</small>` : ''}
            </div>
            <div class="d-flex flex-column gap-1 ms-2">
              ${d.status === 'RESERVADO' ? `<button class="btn btn-sm btn-success" onclick="confirmarEntrega(${d.id_doacao})">Confirmar Entrega</button>` : ''}
              ${['DISPONIVEL','RESERVADO'].includes(d.status) ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelar(${d.id_doacao})">Cancelar</button>` : ''}
            </div>
          </div>
        </div>
      </div>
    `).join("");
  }

  async function publicarDoacao() {
    const titulo = document.getElementById("titulo").value.trim();
    const quantidade = parseFloat(document.getElementById("quantidade").value);
    const unidade = document.getElementById("unidade").value;
    const validade = document.getElementById("validade").value;
    const categoriaId = document.getElementById("categoria").value;

    if (!titulo || !quantidade || !validade) {
      mostrarAlerta("Preencha todos os campos.", "danger"); return;
    }

    const res = await fetch(`${API}/doacoes?doador_id=${usuarioId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        titulo, quantidade,
        unidade_medida: unidade,
        data_vencimento: validade,
        categoria_id: parseInt(categoriaId),
      }),
    });
    const data = await res.json();
    if (!res.ok) { mostrarAlerta(data.detail || "Erro.", "danger"); return; }

    mostrarAlerta("Doação publicada com sucesso!", "success");
    document.getElementById("titulo").value = "";
    document.getElementById("quantidade").value = "";
    document.getElementById("validade").value = "";
    carregarDoacoes();
  }

  async function confirmarEntrega(id) {
    if (!confirm("Confirmar que a instituição retirou o alimento?")) return;
    const res = await fetch(`${API}/doacoes/${id}/entregar?doador_id=${usuarioId}`, { method: "POST" });
    if (res.ok) carregarDoacoes();
    else alert("Erro ao confirmar entrega.");
  }

  async function cancelar(id) {
    if (!confirm("Cancelar esta doação?")) return;
    const res = await fetch(`${API}/doacoes/${id}/cancelar?usuario_id=${usuarioId}`, { method: "POST" });
    if (res.ok) carregarDoacoes();
    else { const d = await res.json(); alert(d.detail || "Erro."); }
  }

  function mostrarAlerta(msg, tipo) {
    const el = document.getElementById("alertaForm");
    el.className = `alert alert-${tipo}`;
    el.textContent = msg;
    setTimeout(() => el.className = "alert d-none", 4000);
  }

  function formatarData(d) {
    if (!d) return "-";
    const [y,m,dia] = d.split("-");
    return `${dia}/${m}/${y}`;
  }

  function logout() { sessionStorage.clear(); }

  carregarCategorias();
  carregarDoacoes();
</script>
</body>
</html>
