<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FoodLink – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background: #f0f7f0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.1); max-width:420px; width:100%; }
    .logo { font-size:2rem; font-weight:700; color:#2d6a4f; }
    .logo span { color:#52b788; }
    .btn-primary { background:#2d6a4f; border:none; }
    .btn-primary:hover { background:#1b4332; }
    .btn-outline-primary { color:#2d6a4f; border-color:#2d6a4f; }
    .btn-outline-primary:hover { background:#2d6a4f; color:#fff; }
  </style>
</head>
<body>
<div class="card p-4">
  <div class="text-center mb-4">
    <div class="logo">Food<span>Link</span></div>
    <p class="text-muted small">Sistema de Doação de Alimentos</p>
  </div>

  <div id="alerta" class="alert d-none" role="alert"></div>

  <div class="mb-3">
    <label class="form-label fw-semibold">Perfil</label>
    <div class="d-flex gap-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="perfil" id="perfilDoador" value="DOADOR" checked/>
        <label class="form-check-label" for="perfilDoador">Doador</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="perfil" id="perfilInst" value="INSTITUICAO"/>
        <label class="form-check-label" for="perfilInst">Instituição</label>
      </div>
    </div>
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">E-mail</label>
    <input type="email" class="form-control" id="email" placeholder="seu@email.com"/>
  </div>
  <div class="mb-4">
    <label for="senha" class="form-label">Senha</label>
    <input type="password" class="form-control" id="senha" placeholder="••••••••"/>
  </div>

  <button class="btn btn-primary w-100 mb-2" onclick="entrar()">Entrar</button>
  <a href="cadastro.html" class="btn btn-outline-primary w-100">Criar conta</a>
</div>

<script>
  const API = "http://localhost:8000";

  async function entrar() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const perfil = document.querySelector('input[name="perfil"]:checked').value;

    if (!email || !senha) { mostrarAlerta("Preencha e-mail e senha.", "danger"); return; }

    try {
      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha, tipo_perfil: perfil }),
      });
      const data = await res.json();
      if (!res.ok) { mostrarAlerta(data.detail || "Erro ao entrar.", "danger"); return; }

      sessionStorage.setItem("usuario_id", data.usuario_id);
      sessionStorage.setItem("nome", data.nome);
      sessionStorage.setItem("tipo_perfil", data.tipo_perfil);
      sessionStorage.setItem("token", data.access_token);

      if (data.tipo_perfil === "DOADOR") {
        window.location.href = "doador.html";
      } else {
        window.location.href = "instituicao.html";
      }
    } catch (e) {
      mostrarAlerta("Não foi possível conectar à API. Certifique-se de que o backend está rodando.", "danger");
    }
  }

  function mostrarAlerta(msg, tipo) {
    const el = document.getElementById("alerta");
    el.className = `alert alert-${tipo}`;
    el.textContent = msg;
  }

  // Permitir Enter no campo senha
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("senha").addEventListener("keyup", e => {
      if (e.key === "Enter") entrar();
    });
  });
</script>
</body>
</html>
