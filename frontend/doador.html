<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FoodLink – Painel do Doador</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body {
      background: #f6f9f7;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .navbar {
      background: #ffffff;
      border-bottom: 1px solid #e9ecef;
    }

    .navbar-brand {
      font-weight: 700;
      color: #1b4332 !important;
    }

    .navbar-brand span {
      color: #52b788;
    }

    .user-name {
      font-size: 0.85rem;
      color: #6c757d;
    }

    .btn-logout {
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .card {
      border: none;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #6c757d;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #495057;
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #dee2e6;
    }

    .form-control:focus, .form-select:focus {
      border-color: #52b788;
      box-shadow: 0 0 0 3px rgba(82,183,136,0.2);
    }

    .btn-foodlink {
  background: linear-gradient(135deg, #2d6a4f, #52b788);
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-weight: 600;
  color: #ffffff;
}

.btn-foodlink:hover {
  opacity: 0.95;
  color: #ffffff;
}

.logo-navbar {
  height: 100px;
}
    .doacao-card {
      background: #f8faf9;
      border-radius: 12px;
      padding: 12px;
    }

    .status {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
    }

    .DISPONIVEL { background: #52b788; }
    .RESERVADO { background: #f4a261; }
    .ENTREGUE { background: #6c757d; }
    .CANCELADO { background: #e63946; }

    .alert {
      border-radius: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar mb-4">
  <div class="container d-flex justify-content-between">
  <div class="d-flex align-items-center">
  <img src="logo.png" class="logo-navbar">
</div>

    <div class="d-flex align-items-center gap-3">
      <span class="user-name" id="nomeNav"></span>
      <a href="index.html" class="btn btn-outline-secondary btn-sm btn-logout" onclick="logout()">Sair</a>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="row g-4">

    <!-- NOVA DOAÇÃO -->
    <div class="col-md-5">
      <div class="card p-4">

        <div class="section-title">NOVA DOAÇÃO</div>

        <div id="alertaForm" class="alert d-none"></div>

        <div class="mb-2">
          <label class="form-label">Nome do alimento</label>
          <input type="text" class="form-control" id="titulo"/>
        </div>

        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label">Quantidade</label>
            <input type="number" class="form-control" id="quantidade"/>
          </div>
          <div class="col-6">
            <label class="form-label">Unidade</label>
            <select class="form-select" id="unidade">
              <option>unid</option>
              <option>kg</option>
              <option>g</option>
              <option>litros</option>
              <option>caixas</option>
              <option>pacotes</option>
            </select>
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label">Validade</label>
          <input type="date" class="form-control" id="validade"/>
        </div>

        <div class="mb-3">
          <label class="form-label">Categoria</label>
          <select class="form-select" id="categoria"></select>
        </div>

        <button class="btn btn-foodlink w-100" onclick="publicarDoacao()">
          Publicar doação
        </button>

      </div>
    </div>

    <!-- LISTA -->
    <div class="col-md-7">
      <div class="card p-4">

        <div class="section-title">MINHAS DOAÇÕES</div>

        <div id="listaDoacoes">
          <p class="text-muted text-center">Carregando...</p>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
  const API = "https://foodlink-backend-m6n0.onrender.com"
  const usuarioId = sessionStorage.getItem("usuario_id");
  const nome = sessionStorage.getItem("nome");

  if (!usuarioId || sessionStorage.getItem("tipo_perfil") !== "DOADOR") {
    window.location.href = "index.html";
  }

  document.getElementById("nomeNav").textContent = nome;

  document.getElementById("validade").min = new Date().toISOString().split("T")[0];

  async function carregarCategorias() {
    const res = await fetch(`${API}/categorias`);
    const cats = await res.json();
    const sel = document.getElementById("categoria");

    cats.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.id_categoria;
      opt.textContent = c.nome;
      sel.appendChild(opt);
    });
  }

  async function carregarDoacoes() {
    const res = await fetch(`${API}/doacoes/usuario/${usuarioId}`);
    const doacoes = await res.json();
    const el = document.getElementById("listaDoacoes");

    if (doacoes.length === 0) {
      el.innerHTML = '<p class="text-muted text-center">Nenhuma doação cadastrada.</p>';
      return;
    }

    el.innerHTML = doacoes.map(d => `
      <div class="doacao-card mb-2">
        <div class="d-flex justify-content-between">
          <div>
            <strong>${d.titulo}</strong>
            <span class="status ${d.status} ms-2">${d.status}</span><br/>
            <small class="text-muted">
              ${d.quantidade} ${d.unidade_medida} · Validade: ${formatarData(d.data_vencimento)}
            </small>
          </div>

          <div class="d-flex flex-column gap-1">
            ${d.status === 'RESERVADO' ? `<button class="btn btn-sm btn-success" onclick="confirmarEntrega(${d.id_doacao})">Confirmar</button>` : ''}
            ${['DISPONIVEL','RESERVADO'].includes(d.status) ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelar(${d.id_doacao})">Cancelar</button>` : ''}
          </div>
        </div>
      </div>
    `).join("");
  }

  async function publicarDoacao() {
    const titulo = document.getElementById("titulo").value.trim();
    const quantidade = parseFloat(document.getElementById("quantidade").value);
    const unidade = document.getElementById("unidade").value;
    const validade = document.getElementById("validade").value;
    const categoriaId = document.getElementById("categoria").value;

    if (!titulo || !quantidade || !validade) {
      mostrarAlerta("Preencha todos os campos.", "danger");
      return;
    }

    const res = await fetch(`${API}/doacoes?doador_id=${usuarioId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        titulo,
        quantidade,
        unidade_medida: unidade,
        data_vencimento: validade,
        categoria_id: parseInt(categoriaId),
      }),
    });

    const data = await res.json();

    if (!res.ok) {
      mostrarAlerta(data.detail || "Erro.", "danger");
      return;
    }

    mostrarAlerta("Doação publicada com sucesso!", "success");

    document.getElementById("titulo").value = "";
    document.getElementById("quantidade").value = "";
    document.getElementById("validade").value = "";

    carregarDoacoes();
  }

  async function confirmarEntrega(id) {
    if (!confirm("Confirmar entrega?")) return;
    const res = await fetch(`${API}/doacoes/${id}/entregar?doador_id=${usuarioId}`, { method: "POST" });
    if (res.ok) carregarDoacoes();
  }

  async function cancelar(id) {
    if (!confirm("Cancelar doação?")) return;
    const res = await fetch(`${API}/doacoes/${id}/cancelar?usuario_id=${usuarioId}`, { method: "POST" });
    if (res.ok) carregarDoacoes();
  }

  function mostrarAlerta(msg, tipo) {
    const el = document.getElementById("alertaForm");
    el.className = `alert alert-${tipo}`;
    el.textContent = msg;
    setTimeout(() => el.className = "alert d-none", 4000);
  }

  function formatarData(d) {
    if (!d) return "-";
    const [y,m,dia] = d.split("-");
    return `${dia}/${m}/${y}`;
  }

  function logout() {
    sessionStorage.clear();
  }

  carregarCategorias();
  carregarDoacoes();
</script>

</body>
</html>
