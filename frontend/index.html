<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title> – Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body {
      background: linear-gradient(135deg, #edf6f1, #f8fafc);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      border: none;
      border-radius: 20px;
      padding: 32px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      max-width: 420px;
      width: 100%;
    }

    .logo-img {
      width: 200px;
      margin-bottom: 0px;
      margin-top: -50px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1b4332;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6c757d;
      margin-top: -30px;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #495057;
    }

    .form-control {
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #dee2e6;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: #52b788;
      box-shadow: 0 0 0 3px rgba(82,183,136,0.2);
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #6c757d;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2d6a4f, #52b788);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .btn-outline-primary {
      border-radius: 10px;
      font-weight: 500;
      border-color: #2d6a4f;
      color: #2d6a4f;
    }

    .btn-outline-primary:hover {
      background: #2d6a4f;
      color: #fff;
    }

    .alert {
      border-radius: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<div class="card">

  <!-- HEADER -->
  <div class="text-center mb-4">
    <img src="logo.png" class="logo-img"/>
    <div class="title"></div>
    <div class="subtitle">Acesse sua conta</div>
  </div>

  <div id="alerta" class="alert d-none" role="alert"></div>

  <!-- PERFIL -->
  <div class="section-title">TIPO DE ACESSO</div>

  <div class="d-flex gap-3 mb-3">
    <div class="form-check">
      <input class="form-check-input" type="radio" name="perfil" id="perfilDoador" value="DOADOR" checked/>
      <label class="form-check-label" for="perfilDoador">Doador</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="perfil" id="perfilInst" value="INSTITUICAO"/>
      <label class="form-check-label" for="perfilInst">Instituição</label>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="section-title">DADOS DE ACESSO</div>

  <div class="mb-3">
    <label for="email" class="form-label">E-mail</label>
    <input type="email" class="form-control" id="email" placeholder="seu@email.com"/>
  </div>

  <div class="mb-4">
    <label for="senha" class="form-label">Senha</label>
    <input type="password" class="form-control" id="senha" placeholder="••••••••"/>
  </div>

  <!-- BOTÕES -->
  <button class="btn btn-primary w-100 mb-2" onclick="entrar()">
    Entrar na plataforma
  </button>

  <a href="cadastro.html" class="btn btn-outline-primary w-100">
    Criar nova conta
  </a>

</div>

<script>
  const API = "https://foodlink-backend-m6n0.onrender.com"

  async function entrar() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const perfil = document.querySelector('input[name="perfil"]:checked').value;

    if (!email || !senha) {
      mostrarAlerta("Preencha e-mail e senha.", "danger");
      return;
    }

    try {
      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha, tipo_perfil: perfil }),
      });

      const data = await res.json();

      if (!res.ok) {
        mostrarAlerta(data.detail || "Erro ao entrar.", "danger");
        return;
      }

      sessionStorage.setItem("usuario_id", data.usuario_id);
      sessionStorage.setItem("nome", data.nome);
      sessionStorage.setItem("tipo_perfil", data.tipo_perfil);
      sessionStorage.setItem("token", data.access_token);

      if (data.tipo_perfil === "DOADOR") {
        window.location.href = "doador.html";
      } else {
        window.location.href = "instituicao.html";
      }

    } catch (e) {
      mostrarAlerta("Não foi possível conectar à API.", "danger");
    }
  }

  function mostrarAlerta(msg, tipo) {
    const el = document.getElementById("alerta");
    el.className = `alert alert-${tipo}`;
    el.textContent = msg;
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("senha").addEventListener("keyup", e => {
      if (e.key === "Enter") entrar();
    });
  });
</script>

</body>
</html>
